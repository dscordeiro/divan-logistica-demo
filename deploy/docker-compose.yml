# VPS com Docker: app + PostgreSQL + Caddy (HTTPS automático)
# Uso: cd deploy && cp ../.env.example .env (ajuste) && docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://divan:${POSTGRES_PASSWORD}@db:5432/divan_links
      HOST: 0.0.0.0
      PORT: 3000
    volumes:
      - appdata:/app/data
    depends_on:
      db: { condition: service_healthy }
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: divan_links
      POSTGRES_USER: divan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U divan -d divan_links"]
      interval: 5s
      retries: 10
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
    depends_on: [app]
volumes: { appdata: {}, pgdata: {}, caddydata: {} }
